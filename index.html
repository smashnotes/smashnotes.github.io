<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smash Notes</title>
<link rel="shortcut icon" href="https://easycss.github.io/favicon/favicon.png" type="image/x-icon" />
<script src="tailwindcss.min.js"></script>
<style>
  @font-face {
    font-family: 'Special Elite';
    src: url('SpecialElite-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: fallback;
  }

  body {
    height: 100vh;
    overflow: hidden;
    /* font-family: monospace; */
    font-family: 'Special Elite';
    }

    p:focus, div:focus, span:focus {
    outline: none; /* Removes the default focus outline */
  }
  
    .cursor {
        border-right: 2px solid black;
        animation: blink 1s step-end infinite;
    }
    @keyframes blink {
        from, to {
            border-color: transparent;
        }
        50% {
            border-color: black;
        }
    }
    #page{
      font-size: 20px;
    }
    .instruction-text{
      font-size: 20px!important;
      letter-spacing: 2px;
      line-height: 28px;
    }
    
    ::selection {
      background-color: yellow; /* user select highlight color */
      color: black;
    }

    /* Firefox */
    ::-moz-selection {
      background-color: yellow;
      color: black;
    }
.dragging {
    opacity: 0.7;
    cursor: move;
}

</style>
</head>
<body>
    <div class="flex flex-col items-center md:items-start md:flex-row md:justify-between m-1">
        <h1 class="mb-1 md:mb-0 text-xl text-black font-bold font-sans">Smash<span class="text-red-600 italic">Notes</span></h1>

        <div class="mt-1">
          <button id="saveNotesToFile" class="w-fit px-4 py-2 bg-green-700 text-white rounded hover:bg-green-600">Export notes</button>

          <button id="textSmallerButton" class="px-4 py-2 bg-slate-700 text-white rounded hover:bg-slate-600">
              -
          </button>

          <button id="textBiggerButton" class="px-4 py-2 bg-slate-700 text-white rounded hover:bg-slate-600">
              +
          </button>

          <button id="clearButton" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
              Clear All
          </button>
        </div>
    
    

    </div>

 <div id="page" class="bg-white p-4 min-h-screen"></div>




<script src="script.js"></script>
<!-- <script src="script.min.js"></script> -->
</body>
</html>
